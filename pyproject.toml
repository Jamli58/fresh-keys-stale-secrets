[project]
name = "numpriv"
version = "0.1.0"
description = "Code and data for \"Fresh Keys, Stale Secrets: Numeric Leakage across Linked LLM Prompts\""
authors = [
    { name = "Jian Li" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: small-instance reference checks against exact rejection sampling (minutes)"]
